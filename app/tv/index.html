<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screens</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  /* Rotation from the CMS (0/90/180/270). 90 and 270 swap the stage's
     width and height so a portrait-mounted panel fills edge to edge. */
  #stage.rot90  { width: 100vh; height: 100vw; transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
  #stage.rot180 { transform: rotate(180deg); }
  #stage.rot270 { width: 100vh; height: 100vw; transform-origin: top left; transform: rotate(-90deg) translateX(-100%); }
  #stage video, #stage img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* Two videos stacked: the one on show on top, the next item opening
     underneath it. The still image and the idle text sit above both. */
  #stage video { z-index: 1; }
  #stage img { display: none; z-index: 3; }
  #idle { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
          color: #6b6b6b; font: 500 22px/1.4 system-ui, sans-serif; text-align: center; padding: 40px; }
  /* Shown only while the screen is lining up with its group. */
  #syncing { position: absolute; right: 2.4vmin; bottom: 2.4vmin; width: 2.6vmin; height: 2.6vmin; z-index: 5;
             opacity: 0; transition: opacity 0.8s; pointer-events: none;
             filter: drop-shadow(0 0 0.5vmin rgba(0,0,0,0.55)); }
  #syncing.on { opacity: 0.5; }
  #syncing.on svg { animation: turn 4s linear infinite; }
  #syncing svg { display: block; width: 100%; height: 100%; }
  @keyframes turn { to { transform: rotate(360deg); } }
  #debug { position: fixed; left: 12px; bottom: 12px; z-index: 10; display: none; max-width: 60vw;
           background: rgba(0,0,0,0.78); color: #e8e8e8; border: 1px solid #333; border-radius: 8px;
           font: 13px/1.45 ui-monospace, "DejaVu Sans Mono", Consolas, monospace; padding: 10px 12px; white-space: pre-wrap; }
  #debug b { color: #9fd3c5; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <video id="videoA" muted playsinline preload="auto"></video>
  <video id="videoB" muted playsinline preload="auto"></video>
  <img id="image" alt="">
  <div id="idle">Starting…</div>
  <div id="syncing" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.3L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.3L20 15.5"/><path d="M20 20v-4.5h-4.5"/></svg></div>
</div>
<div id="debug"></div>
<script src="/tv/mp4.js"></script>
<script src="/tv/player.js"></script>
</body>
</html>
