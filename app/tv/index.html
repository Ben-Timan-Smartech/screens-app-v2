<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screens</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  /* Rotation from the CMS (0/90/180/270). 90 and 270 swap the stage's
     width and height so a portrait-mounted panel fills edge to edge. */
  #stage.rot90  { width: 100vh; height: 100vw; transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
  #stage.rot180 { transform: rotate(180deg); }
  #stage.rot270 { width: 100vh; height: 100vw; transform-origin: top left; transform: rotate(-90deg) translateX(-100%); }
  #stage video, #stage img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #stage img { display: none; }
  #idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          color: #6b6b6b; font: 500 22px/1.4 system-ui, sans-serif; text-align: center; padding: 40px; }
  #debug { position: fixed; left: 12px; bottom: 12px; z-index: 10; display: none; max-width: 60vw;
           background: rgba(0,0,0,0.78); color: #e8e8e8; border: 1px solid #333; border-radius: 8px;
           font: 13px/1.45 ui-monospace, "DejaVu Sans Mono", Consolas, monospace; padding: 10px 12px; white-space: pre-wrap; }
  #debug b { color: #9fd3c5; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" muted playsinline preload="auto"></video>
  <img id="image" alt="">
  <div id="idle">Starting…</div>
</div>
<div id="debug"></div>
<script src="player.js"></script>
</body>
</html>
