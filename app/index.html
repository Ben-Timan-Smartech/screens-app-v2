<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screens — Smartech Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#141414" />
<!-- Brand assets are served by serve.py's /brand/ route. SVG first; the
     two fallbacks cover older browsers and pinned-tab use cases. -->
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/brand/favicon.ico" />
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'PP Neue Montreal', system-ui, sans-serif; background: var(--bone); }
  #root { height: 100vh; width: 100vw; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<!-- Google Identity Services — provides window.google.accounts.id used by the login screen. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script type="text/babel" src="components/data.jsx"></script>
<!-- Generated by scan-videos.py — overrides MOCK_VIDEOS / MOCK_BRANDS with real Drive content. -->
<script type="text/babel" src="components/real-data.jsx"></script>
<!-- Auth context + login screen. Loaded before ui.jsx so Sidebar can read the current user. -->
<script type="text/babel" src="components/auth.jsx"></script>
<script type="text/babel" src="components/ui.jsx"></script>
<script type="text/babel" src="components/CommandPalette.jsx"></script>
<script type="text/babel" src="screens/Dashboard.jsx"></script>
<script type="text/babel" src="screens/ContentLibrary.jsx"></script>
<script type="text/babel" src="screens/ScreensStore.jsx"></script>
<script type="text/babel" src="screens/SyncPicker.jsx"></script>
<script type="text/babel" src="screens/ScreenDetail.jsx"></script>
<script type="text/babel" src="screens/SyncGroups.jsx"></script>
<script type="text/babel" src="screens/Schedules.jsx"></script>
<script type="text/babel" src="screens/Settings.jsx"></script>
<script type="text/babel" src="screens/Users.jsx"></script>
<script type="text/babel" src="screens/Tablet.jsx"></script>
<script type="text/babel" src="main.jsx"></script>
</body>
</html>
