# JVM heap for Gradle workers. Bumped from 2GB → 4GB so the Kotlin
# compiler and R8 don't thrash GC on the larger Compose + Media3
# graph. CI runners have 7GB available; 4GB leaves room for OS +
# child processes. Locally it just means Gradle doesn't have to
# shed cached state mid-build.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin compiler daemon — give it its own slice rather than borrowing
# from Gradle's heap. Speeds up incremental compile by ~20–30 % on CI.
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
