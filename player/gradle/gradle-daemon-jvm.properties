#This file is generated by updateDaemonJvm
#
# v0.1.30 hotfix: previously pinned to JETBRAINS JDK 21 with the
# foojay URL IDs that were generated when this file was last
# regenerated. Foojay rotates those IDs server-side; on 2026-06-16
# every cached ID started returning HTTP 400 from
# https://api.foojay.io/disco/v3.0/ids/.../redirect and the build
# died at toolchain provisioning.
#
# Switching to ADOPTIUM (Eclipse Temurin) — the de-facto Android JDK
# distribution and the one GitHub Actions runners pre-install. The
# URL pins are removed so Gradle re-queries foojay for a fresh ID
# every build, which avoids the same staleness biting again. If the
# runner already has Temurin 21 (it does, as of `ubuntu-latest` in
# 2026), Gradle picks it up locally and never hits foojay at all.
toolchainVendor=ADOPTIUM
toolchainVersion=21
